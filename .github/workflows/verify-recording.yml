# Modified for the Studio 4000 recording fixes: verify the branch before publication.
name: Verify Studio 4000 changes
on:
  push:
    branches: [fix/recording-and-selection, fix/studio-refinements]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restore audio dependency build
        id: audio-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            external
            build
          key: recording-win-v1-${{ hashFiles('tools/deps.json') }}-${{ github.sha }}
          restore-keys: recording-win-v1-${{ hashFiles('tools/deps.json') }}-
      - name: Fetch audio and WebView2 dependencies
        shell: pwsh
        run: .\tools\fetch-deps.ps1
      - name: Build Windows app with ASIO
        shell: pwsh
        run: .\build.ps1 -RequireAsio
      - name: Cache compiled audio dependencies
        uses: actions/cache/save@v4
        with:
          path: |
            external
            build
          key: ${{ steps.audio-cache.outputs.cache-primary-key }}
      - name: Test UI
        working-directory: ui
        run: npm test
      - name: Test effect presets, DSP and audio duplication
        shell: pwsh
        run: .\tools\test-refinements.ps1
      - name: Test recorded timing and live waveforms
        shell: pwsh
        run: .\tools\test-recording.ps1
      - name: Preserve recording test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-test-logs
          path: |
            recording-test.*
            refinement-test.*
          if-no-files-found: ignore
